name: Web – Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # für den Branch "deploy" (Lincolnsoft Server)
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Seite zusammenstellen
        run: mkdir site && cp index.html site/ && cp -r fonts site/

      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Server-Branch "deploy" aktualisieren (für den Lincolnsoft Server)
        run: |
          cd site
          git init -q -b deploy
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA::7}"
          git push -f -q "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" deploy

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  verify:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Playwright
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Live-Test
        run: python tests/live_check.py "${{ needs.deploy.outputs.url }}"
